<!-- Define the document shell used by Vite before React mounts. -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Use UTF-8 so all page text is interpreted consistently. -->
    <meta charset="UTF-8" />
    <!-- Use the project favicon when it is available. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Make the layout responsive on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the browser tab title. -->
    <title>TaskFlow</title>
  </head>
  <body>
    <!-- React replaces this mount point with the application UI. -->
    <div id="root"></div>
    <!-- Load the JavaScript entry point as an ES module. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
